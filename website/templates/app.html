<!DOCTYPE html>
<html lang="en" class="h-full">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% if page_title %}{{ page_title }} - {% endif %}Cross-Inertia</title>
    <meta name="description" content="{% if meta_description %}{{ meta_description }}{% else %}Inertia.js adapter for Python backends. Build modern SPAs with FastAPI and React.{% endif %}">

    {{ vite() | safe }}

</body>
</html>
