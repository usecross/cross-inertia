[tool.uv.workspace]
members = ["examples/*"]

[project]
name = "cross-inertia"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Patrick Arminio", email = "patrick.arminio@gmail.com" }
]
requires-python = ">=3.10"
dependencies = [
    "lia-web>=0.2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/inertia"]

[dependency-groups]
dev = [
    "fastapi>=0.116.1",
    "pytest>=8.4.2",
    "pytest-cov>=6.0.0",
    "pytest-playwright>=0.6.2",
    "playwright>=1.48.0",
    "httpx>=0.28.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --strict-markers"
markers = [
    "e2e: End-to-end tests (slow, requires browser)",
    "unit: Unit tests (fast)",
]
