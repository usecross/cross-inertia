version: 2
updates:
  # Main Python package (uv)
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      python-dependencies:
        patterns:
          - "*"

  # Website Python dependencies (uv)
  - package-ecosystem: "uv"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(website)"
    groups:
      website-python-dependencies:
        patterns:
          - "*"

  # Website frontend dependencies (Bun)
  - package-ecosystem: "bun"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(website)"
    groups:
      website-bun-dependencies:
        patterns:
          - "*"

  # FastAPI example frontend dependencies (Bun)
  - package-ecosystem: "bun"
    directory: "/examples/fastapi"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(example)"
    groups:
      example-bun-dependencies:
        patterns:
          - "*"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
