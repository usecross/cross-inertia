version: 2
updates:
  # Main Python package
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"

  # Website Python dependencies
  - package-ecosystem: "pip"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(website)"

  # Website npm dependencies
  - package-ecosystem: "npm"
    directory: "/website"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps(website)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
