name: 🧹 Lint

on:
  push:
    branches: [main]
  # No branch filter: stacked PRs target another PR's branch, and CI must run
  # for them too.
  pull_request:

jobs:
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
      
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      
      - name: Install nox
        run: uv pip install --system nox
      
      - name: Run linting
        run: nox -s lint
      
      - name: Run type checking
        run: nox -s typecheck
