name: 🚀 AutoPub Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  check-release:
    name: 📦 Check for release
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.check.outputs.has_release }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"

      - name: Check for release
        id: check
        run: |
           if uvx --from autopub==1.0.0a63 --with pygithub==2.10.0 autopub check; then
             echo "has_release=true" >> $GITHUB_OUTPUT
           else
             echo "has_release=false" >> $GITHUB_OUTPUT
             if [ "${{ github.event_name }}" = "pull_request" ]; then
               exit 1
             fi
           fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify .autopub directory
        if: steps.check.outputs.has_release == 'true'
        run: |
          if [ -d ".autopub" ]; then
            echo "✓ Found .autopub directory"
          else
            echo "✗ No .autopub directory found"
            exit 1
          fi

      - name: Upload .autopub artifact
        if: steps.check.outputs.has_release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: autopub-data
          path: .autopub
          include-hidden-files: true

      - name: Debug info
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "has_release: ${{ steps.check.outputs.has_release }}"

  publish:
    name: 📦 Publish to PyPI
    needs: check-release
    if: ${{ github.ref == 'refs/heads/main' && needs.check-release.outputs.has_release == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug info
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "has_release: ${{ needs.check-release.outputs.has_release }}"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.9"

      - name: Download .autopub artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: autopub-data
          path: .autopub

      - name: Build and publish
        run: |
          echo "✨ Preparing release..."
          uvx --from autopub==1.0.0a63 --with pygithub==2.10.0 autopub prepare
          echo "✨ Building package..."
          uvx --from autopub==1.0.0a63 --with pygithub==2.10.0 autopub build
          echo "✨ Publishing to PyPI..."
          uvx --from autopub==1.0.0a63 --with pygithub==2.10.0 autopub publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
