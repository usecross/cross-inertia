name: 🚀 AutoPub Release

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write

jobs:
  check-release:
    name: 📦 Check for release
    runs-on: ubuntu-latest
    outputs:
      has_release: ${{ steps.check.outputs.has_release }}

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Check for release
        id: check
        run: |
           if uvx --from autopub==1.0.0a57 --with pygithub autopub check; then
             echo "has_release=true" >> $GITHUB_OUTPUT
           else
             echo "has_release=false" >> $GITHUB_OUTPUT
             if [ "${{ github.event_name }}" = "pull_request" ]; then
               exit 1
             fi
           fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify .autopub directory
        if: steps.check.outputs.has_release == 'true'
        run: |
          if [ -d ".autopub" ]; then
            echo "✓ Found .autopub directory"
          else
            echo "✗ No .autopub directory found"
            exit 1
          fi

      - name: Upload .autopub artifact
        if: steps.check.outputs.has_release == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: autopub-data
          path: .autopub
          include-hidden-files: true

      - name: Debug info
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "has_release: ${{ steps.check.outputs.has_release }}"

  publish:
    name: 📦 Publish to PyPI
    needs: check-release
    if: ${{ github.ref == 'refs/heads/main' && needs.check-release.outputs.has_release == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Debug info
        run: |
          echo "GitHub ref: ${{ github.ref }}"
          echo "has_release: ${{ needs.check-release.outputs.has_release }}"

      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Download .autopub artifact
        uses: actions/download-artifact@v8
        with:
          name: autopub-data
          path: .autopub

      - name: Build and publish
        run: |
          echo "✨ Preparing release..."
          uvx --from autopub==1.0.0a57 --with pygithub autopub prepare
          echo "✨ Building package..."
          uvx --from autopub==1.0.0a57 --with pygithub autopub build
          echo "✨ Publishing to PyPI..."
          uvx --from autopub==1.0.0a57 --with pygithub autopub publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
